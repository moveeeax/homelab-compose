name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Python tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip
          pip3 install --break-system-packages pyyaml pytest

      - name: Run tests
        run: python3 -m pytest -v

      - name: Shellcheck
        run: shellcheck -x backup/*.sh scripts/*.sh

      - name: Check Prometheus config and alert rules
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.15.1 check config /etc/prometheus/prometheus.yml
